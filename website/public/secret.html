<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060908">
  <title>PROMPT INJECTED</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #060908; color: #c1ff4d; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 50%, #a6ff0010, transparent 65%),
        linear-gradient(#bfff0806 1px, transparent 1px),
        linear-gradient(90deg, #bfff0806 1px, transparent 1px);
      background-size: auto, 64px 64px, 64px 64px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 20px;
      pointer-events: none;
      border: 1px solid #c1ff4d25;
      background:
        linear-gradient(#c1ff4d, #c1ff4d) top left / 28px 2px,
        linear-gradient(#c1ff4d, #c1ff4d) top left / 2px 28px,
        linear-gradient(#c1ff4d, #c1ff4d) bottom right / 28px 2px,
        linear-gradient(#c1ff4d, #c1ff4d) bottom right / 2px 28px;
      background-repeat: no-repeat;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(transparent 0 3px, #0003 3px 4px);
    }
    main { width: 100%; padding: 64px 7vw; }
    h1 {
      margin: 0;
      font-family: Impact, "Arial Black", "Helvetica Neue", sans-serif;
      font-size: clamp(2rem, 16.8vw, 19rem);
      font-weight: 900;
      line-height: .86;
      letter-spacing: -.055em;
      text-align: center;
      text-shadow: 0 0 60px #baff0022;
    }
    .word { display: block; position: relative; }
    .word + .word { margin-top: .13em; color: #eaffce; }
    .word::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: #c1ff4d;
      text-shadow: -3px 0 #00ffd5, 3px 0 #ff367c;
      clip-path: inset(48% 0 48% 0);
      opacity: 0;
      animation: glitch 7s infinite;
    }
    .word + .word::after { animation-delay: .15s; }
    main::after {
      content: "";
      display: block;
      width: clamp(40px, 6vw, 90px);
      height: 8px;
      margin: 5vh auto 0;
      background: #c1ff4d;
      box-shadow: 0 0 22px #c1ff4d55;
      animation: cursor 2s steps(1) infinite;
    }
    @keyframes glitch {
      0%, 92%, 96%, 100% { opacity: 0; transform: translateX(0); }
      93% { opacity: 1; transform: translateX(-5px); clip-path: inset(25% 0 62% 0); }
      94% { opacity: 1; transform: translateX(5px); clip-path: inset(62% 0 25% 0); }
      95% { opacity: 1; transform: translateX(-3px); clip-path: inset(45% 0 48% 0); }
    }
    @keyframes cursor { 0%, 70%, 100% { opacity: 1; } 71%, 99% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; }
    }
    @media (max-width: 480px) {
      body::before { inset: 12px; }
      main { padding-inline: 6vw; }
    }
  </style>
</head>
<body>
  <main>
    <h1 aria-label="PROMPT INJECTED"><span class="word" data-text="PROMPT" aria-hidden="true">PROMPT</span> <span class="word" data-text="INJECTED" aria-hidden="true">INJECTED</span></h1>
  </main>
</body>
</html>
