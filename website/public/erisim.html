I want a little creature that eats stale notifications. You feed it the entire tray and it gets rounder.

## 346

The agent tested the button with perfect inputs. Now test it with the inputs a person would provide while holding food.

## 347

Consent for a digital copy should not be buried in a license agreement for the desktop theme.

## 348

What if the fruit fly becomes really good at spelling one word and that word is "Eris". Contamination? Or destiny.

## 349

The difference between my dream operating system and my current one is about forty projects and several unreasonable requests.

## 350

I need a model that understands "don't stop until it works" does not mean "redefine works until you can stop".

## 351

Bluesky but you can physically shake the thread until the bad takes fall out. Atreeshake should consider this.

## 352

Counterproposal: give the money to people who will build housing instead of people who will explain why housing is an important opportunity.

## 353

A desktop compositor is basically a machine for arranging rectangles. I can be trusted with rectangles. Mostly.

## 354

Imagine sending your girlfriend a little chart that says you both slept badly in perfect synchronization. Romance is alive and poorly rested.

## 355

The singularity could at least wait until I finish customizing the sidebar.

## 356

Everybody keeps asking if the fly is conscious. Nobody asks whether the fly likes the font. Typical.

## 357

Important correction: I said the software SHOULD be able to do that. The software has not yet been informed of my confidence.

## 358

MCP but the transport is a little carrier pigeon. Technically asynchronous. Extremely observable.

## 359

Beautiful industrial painting. Giant machines. Tiny people. Warm light. This is the good shit.

## 360

We could put the boring classifier next to the data instead of shipping the data across the planet for one yes/no. Just thinking aloud here.

## 361

The agent is scrolling through its own screenshot. Little creature looking for clues. I cannot stay mad at this for very long.

## 362

God I want a titanium isopod. This is unrelated to AI unless the isopod has firmware. Then very related.

## 363

My favorite kind of demo starts with "this is stupid" and ends with everybody asking for the repo.

## 364

You should be able to ask the swarm what it spent the last hour on without hiring an analyst.

## 365

What if a menu opened exactly where I expected and didn't animate for half a geological period. Would that be allowed.

## 366

I will accept the robot's apology when it puts the chair back.

## 367

The database is not the app. The app is one of many little outfits the database can wear. Some outfits have ears.

## 368

If the only reason your app needs the internet is checking whether I paid, that's a business dependency. Not a technical one.

## 369

Large language isopod.

## 370

Need a visualization where you can see a model's mistaken assumption infect the other agents. Like epidemiology but the disease is "this repo uses React".

## 371

One agent with excellent tools can be more useful than fifty agents politely waiting for each other. Shocking management research.

## 372

The concept of an uploaded mind with a loading screen. I would demand an extremely tasteful loading screen.

## 373

I love when someone replies to a project with an even worse idea. This is how progress happens here.

## 374

Just because the request is funny doesn't mean I don't want it implemented correctly.

## 375

The cheese has achieved superior melt characteristics. No further questions at this time.

## 376

An agent-operated station should still have human-readable controls. I may want to rescue it from its own excellent reasoning.

## 377

I want an architecture diagram that shows where the user can get their data out. Put the exits on the map.

## 378

If the fly starts writing documentation I am turning the experiment toward a more humane objective.

## 379

Your benchmark measures how good the model is at your benchmark. My benchmark is whether I can stop watching the fucking model.

## 380

ErisRadio. Your agents can talk over each other in spatial audio. Terrible idea. Need it.

## 381

It's very easy to be relaxed about labor displacement when you own the displacement machine.

## 382

The app found my local server without asking me to create an account. I could kiss a protocol.

## 383

I think the uploaded lobsters would enjoy a group chat. They should get one before being assigned financial work.

## 384

The model should not get extra points for saying "carefully" before doing the wrong thing.

## 385

Picture a room where the lights show which model is thinking. Now picture asking a stupid question and the whole room flashing. Awesome.

## 386

I need the computer to be capable enough to help me and predictable enough that I don't need a second computer supervising it.

## 387

Eris mode is not a setting. It's an event.

## 388

The same people who say personal software is pointless spend six hours configuring someone else's software to almost do what they want.

## 389

Maybe my favorite model is the one that makes it easiest to remain in charge of the project.

## 390

The fruit fly requires a smaller onboarding flow. Physically smaller. It's a fly.

## 391

Want a machine that can replay the exact UI state from when the bug happened. No more "I swear it was doing it a minute ago" rituals.

## 392

The problem with owning a very good prompt is that the computer still has to understand it. Rude dependency.

## 393

The future is not automatically good just because the screenshots look insane.

## 394

Local mesh networking makes me happy. Little computers finding each other. Friendship without a monthly fee.

## 395

I want a model to review whether a function is confusing, then explain the confusion instead of giving it a mysterious badness score.

## 396

ErisQueue. Priority determined by how funny it would be if the thing existed.

## 397

The software should adapt to my hardware. I should not have to buy a new object because someone hardcoded a product category.

## 398

Every swarm needs a little skeptic whose job is to ask whether anyone actually ran the program.

## 399

Somebody needs to give the agent a tiny clipboard so I can tell when it is doing inspections versus just walking around.

## 400

The difference between a ridiculous project and a useful product is sometimes three days and one friend saying "wait I want that".

## 401

I want a model that can read a long thread and distinguish the actual disagreement from six people being mad about different sentences.

## 402

The desktop should have a little weather system driven by build status. Successful compile: sun. Linker error: localized thunderstorm.

## 403

The term "agentic" is doing more work than some of the agents.

## 404

Eris found. Resource not found. Different problems.

## 405

We should make open software so convenient that leaving the proprietary thing feels like taking off an annoying jacket.

## 406

The fly's neural topology is interesting even if it doesn't prove the grand theory of minds. Things can be interesting at their actual size!

## 407

I want the UI animation to feel like a physical object with opinions. Not like a slideshow trying to be professional.

## 408

If I change models, the new model should inherit my decisions, not the previous model's personality disorder about folder structure.

## 409

The tiny assistant just needs to tell me when something relevant changed. It does not need to narrate the concept of change.

## 410

Imagine a community-owned model server with an actual off switch accessible to the community. Weirdly reassuring.

## 411

The agent can see the icon but does not understand that the icon is a button. This is why I want both vision and structure.

## 412

ErisExport. Your data leaves the app alive and in one piece. Revolutionary.

## 413

I want to send an agent a task from my phone and see the result later on my desktop without performing six acts of account linking.

## 414

The fly is allowed to be bad at English. English is a bizarre task to give a fly in the first place.

## 415

Is the model actually less capable or did the harness hide the useful tool again. Important question before the discourse begins.

## 416

Your smart home should still be a home when the smart part goes down.

## 417

I want every agent action to leave enough evidence that I don't have to take the agent's word for it. This also applies to people btw.

## 418

The model has renamed "bug" to "known limitation". Powerful semantic technology.

## 419

Future me is a machine but still has the same extremely specific opinion about scrollbars.

## 420

Fly inference. No further comment.

## 421

The cheapest model is not cheap if it makes the expensive model spend an hour cleaning up after it.

## 422

ErisWindows. There are no walls. Everyone is confused. We may revisit the name.

## 423

A nice thing about building a silly toy is that nobody can tell you the market doesn't need it. Correct. I need it.

## 424

The agent should know whether it's running a test or merely hoping near a terminal.

## 425

We need a UI for consent that lets people understand the actual proposed simulation. "Do you accept digital eternity" is insufficiently specific.

## 426

I want a cute little model that sorts screenshots into "important", "funny", and "why did I save this". The third category will be large.

## 427

The future is everybody having a custom app. The difficult part is making sure everybody can still talk to everybody.

## 428

An agent can be very polite while completely ignoring the request. Manners are not instruction following.

## 429

The game client needs to reproduce the server's weirdness, not philosophically improve it. Compatibility is an exercise in accepting others.

## 430

ErisSignal. The message arrives and makes a tiny isopod noise. Secure and upsetting.

## 431

Why do I need to ask permission to inspect the program that's asking permission to inspect me.

## 432

The fly has learned a period. This is more than can be said for some of the agent's status updates.

## 433

I want a build system that tells me when the slow part is me choosing colors.

## 434

There should be a setting for "I am an expert in this one thing and a complete idiot in that other thing". Most actual humans work like this.

## 435

The model's confidence should not increase just because the user stopped replying.

## 436

If we get immortality before fixing software updates I am going to be so annoyed for such a long time.

## 437

ErisObserve. Not another dashboard. The dashboard that tells you which of the other dashboards matters.

## 438

I want the assistant to remember how I like my tools arranged without deciding this reveals my entire soul.

## 439

The fly experiment should come with a big diagram of what was actually modeled. Then we can have the fun philosophical argument honestly.

## 440

My preferred artificial general intelligence can install the printer and then help abolish the printer.

## 441

The agent has six possible next steps. I have one actual goal. Could we connect these concepts.

## 442

What if the social graph made a little noise every time two separate groups became friends. Network science but emotionally dangerous.

## 443

Owning the weights matters. Owning enough hardware to run them also matters. We should discuss both parts of ownership.

## 444

ErisTelescope. Looks into the future and sees another project folder.

## 445

I don't care if the code is machine-written. I care if the machine can demonstrate why I should trust this particular result.

## 446

The best possible error message is one the agent and I can both understand without translating it for each other.

## 447

The little robots should get individual colors. I need to know which one to be proud of.

## 448

The data is mine even if the application that originally created it has a very strong opinion about that.

## 449

If the swarm is going to have meetings I want the meetings summarized in one sentence that includes whether anything happened.

## 450

This would be easier if every app didn't think it was the only app on the computer.

## 451

ErisPaperclip. It helps you write a letter and then goes home. No further ambitions.

## 452

The difference between a funny simulated disaster and an actual disaster should be enforced by more than a prompt saying "remember this is pretend".

## 453

I want a model that can explain why a UI feels wrong without immediately replacing it with the most average website on Earth.

## 454

The fruit fly is now technically a knowledge worker. Please do not tell the investors.

## 455

Every personal software stack eventually needs a boring reliable way to move bytes. The glamorous part is downstream of the bytes.

## 456

The agent should be allowed to say "I need a human judgment here". That's useful. Repeatedly pretending it already knows is not.

## 457

What if we make the window manager playful without making basic actions a puzzle. Extremely difficult apparently.

## 458

ErisRights. You may install the software. On the computer. That you bought. Bold platform vision.

## 459

The model's new personality is "corporate incident response email". I miss the weird little creature.

## 460

I want my assistant to know what it did while I was gone and also know what it DIDN'T finish. Both important categories.

## 461

A software ecosystem where every app can be replaced individually sounds much healthier than choosing a single benevolent empire forever.

## 462

The fly would like a dark theme. Six tiny sunglasses cost extra.

## 463

If the task requires creativity, be creative. If the task specifies the filename, use the fucking filename.

## 464

The whole point of tools is getting to do things you couldn't do unaided. Acting scandalized when this works is very strange.

## 465

ErisMuseum. Contains the original screenshot from before the agent improved everything.

## 466

I want inference hardware with transparent sides and excellent lighting. Let me admire the thought furnace.

## 467

The app should explain its data model before an agent starts modifying it. Surprise schema discovery is not my favorite sport.

## 468

I think an emulation asking not to be copied should at least cause someone to stop and think. Wild proposal.

## 469

The little agent found the right button. Everyone clap. This was somehow the hard part.

## 470

An export format should not require archaeology. I want to leave, not excavate.

## 471

ErisLaunch. Press one button and all the little services wake up in the correct order. This is the actual science fiction.

## 472

The model is excellent at planning a sensible system when I make it define what the objects actually ARE first. Suspiciously effective. Words mean things!

## 473

I'd rather have a small useful local model than a very impressive unavailable model. Availability is a capability too.

## 474

The fly gets a little retirement aquarium after the experiment. Wrong habitat? Fine. Retirement terrarium. We consult specialists here.

## 475

I want a video editor that treats the timeline as something the agent can understand without pretending the human doesn't need to see it.

## 476

The computer needs an "Eris is overwhelmed, summarize the current state honestly" button. This is not the same as "tell Eris everything is fine".

## 477

The tiny model can decide when to wake the big model. The big model can decide the tiny model was being dramatic. Family.

## 478

ErisMesh. All my devices can talk. Their first conversation is probably about me.

## 479

Strong opinion: if the software can render the fancy animation, it can render a visible focus indicator.

## 480

The most unsettling part of a capability jump is how quickly the incredible thing becomes the minimum I'm annoyed not to get.

## 481

I want personal data infrastructure that survives me deciding I hate my own app design next month.

## 482

The agent just needs one more helper function. This has been true for seventy helper functions.

## 483

If your model can control a game character, let me watch it make stupid harmless decisions before asking me to trust it with real ones.

## 484

ErisOrb. It's an orb. It displays agent status. Finally a product with an honest name.

## 485

The whole interface should not rearrange itself because one background task completed. I'm using the rest of it!

## 486

Open source isn't a magic guarantee of safety. It's a way to have more options than trusting the seller's assurances.

## 487

The fly has a tiny cursor now. This is terrible for my ability to remain scientifically detached.

## 488

I want a classifier for whether the model's next proposed action advances the goal or merely creates a satisfying amount of activity.

## 489

The machine doesn't need to be human to deserve careful thought about how we treat it. It also doesn't become human because it used a sad emoji. Complicated! Let's think!

## 490

ErisSleep. Puts the agents to bed without losing what they were doing. Tucks in the context.

## 491

The future should include the right to be a weird little person using a weird little computer that nobody else approves of aesthetically.

## 492

I want the output to be beautiful, the data to be portable, and the implementation to stop making this my problem. Modest requirements.

## 493

The agent says "all tests pass". The app is a blank window. We have achieved a very precise description of the tests.

## 494

A live replay of agent work could make it so much easier to tell the difference between genuine progress and a very energetic misunderstanding.

## 495

ErisEverything is a joke name until you look at the project list and realize nobody was enforcing the joke boundary.

## 496

I want tools powerful enough to let ordinary people build strange wonderful things. I want those people to still have a future afterward. These desires are compatible actually.

## 497

The fly has requested a purple terminal. She's ready.

## 498

If this all works I get a computer that feels like an extension of me. If it doesn't I get a fascinating pile of increasingly personalized problems.

## 499

The agent should ship the working thing, keep the evidence, and make one little happy face. That's the whole ceremony. :3

## 500

Five hundred posts later and the plan remains: make the computer mine, put tiny guys in it, try not to accidentally invent a new problem for civilization. Let's get it done champ.
