Both Lean and Agda are dependently typed programming languages and proof assistants. This lesson compares their treatment of proofs, their typical workflows, and the difference between proving existence and computing a witness.

## Mini lesson

### 1. Shared foundation: types can depend on values

Both languages support types indexed by values: for example, a vector type indexed by its length. Both also support propositions-as-types: evidence for a proposition is a term of the corresponding type.

Proving “if P then P” is an identity function.

Lean:

\`\`\`lean
example (P : Prop) : P → P :=
  fun p => p
\`\`\`

Agda:

\`\`\`agda
id : {P : Set} → P → P
id p = p
\`\`\`

In either case, supply evidence of P and receive that evidence back. Agda’s \`Set\` is a universe of types, roughly corresponding to Lean’s \`Type\`.

### 2. Proof irrelevance

Lean distinguishes propositions in \`Prop\` from data in \`Type\`. Its kernel treats any two proofs of the same proposition as definitionally equal: interchangeable during type checking without requiring an additional equality proof. This is proof irrelevance. It does not identify arbitrary inhabitants of a data type.

Agda commonly represents propositions as ordinary types in \`Set\`. Interpreting a type as a proposition does not automatically identify all its inhabitants. Agda also offers an optional proof-irrelevant \`Prop\` universe, so “Agda has no proof irrelevance” is too broad.

### 3. Typical workflows

| Aspect | Lean | Agda |
| --- | --- | --- |
| Common proof style | Tactics that construct proof terms | Functions, pattern matching, and filling typed holes |
| Typical emphasis | Formal mathematics and automation | Constructive proofs and dependent programming |
| Direct proof terms | Supported | Supported |
| Automation | Extensive tactic tooling | Also available, with different tooling |

Lean can express the same identity proof using tactics:

\`\`\`lean
example (P : Prop) : P → P := by
  intro p
  exact p
\`\`\`

The tactics construct a term. Lean’s kernel type checker checks that term against the theorem’s type. Tactics are not an alternative logical foundation.

### 4. Checked proofs and executable computations

Classical proofs still have proof terms. Classical reasoning does not bypass checking.

However, a classical proof that an object exists need not give an executable method to find it. Lean can use classical choice to define a selected object, but a definition depending computationally on such choice can require \`noncomputable\`. This does not mean that no algorithm for the same mathematical function could exist; it means this definition lacks the required executable implementation.

Agda can postulate classical principles, but a postulate supplies no computation rule by itself.

### 5. Carrying a witness as data

In Lean, compare these three types, assuming \`P : Nat → Prop\`:

| Type | What an inhabitant supplies |
| --- | --- |
| \`∃ n : Nat, P n\` | An existence proof in \`Prop\`; not in general a computational witness you can project into \`Nat\` |
| \`{ n : Nat // P n }\` | A subtype value in \`Type\`, containing a number \`n\` and evidence of \`P n\` |
| \`Nat × Prop\` | A number and a proposition, without evidence that the proposition holds or a required relationship to the number |

For a computationally constructed subtype value, you can project out its number. Merely placing a result in \`Type\` does not guarantee executability: the construction itself must also be computable.

Agda can similarly represent a witness and its evidence as a dependent pair. A closed, total construction using computational definitions gives a witness that can be evaluated. Lean supports this approach too.

**Central distinction:** having a checked proof term is not the same as having an executable method for obtaining a witness.

## Question 1: proof irrelevance

**Question:** You have two proofs \`p\` and \`q\` of the same proposition. How does Lean treat them when that proposition lives in \`Prop\`, and why can’t you assume the same for an ordinary Agda type in \`Set\`?

### Correct answer

Lean treats them as definitionally equal by proof irrelevance. Ordinary Agda types in \`Set\` do not automatically identify their inhabitants, even when interpreted as propositions.

**Followup:** Correct. The qualification matters: Lean’s rule concerns proofs in \`Prop\`, and Agda also has an optional proof-irrelevant \`Prop\` universe.

### Amber’s answer

> lean has proof irrelevance. agda doesn't when they are just in set.

**Followup:** Correct. More precisely, Lean treats proofs of the same proposition as definitionally equal, while Agda does not impose that rule on ordinary \`Set\` inhabitants.

### Incorrect answer A

> Lean runs both proofs and checks that they return the same result.

**Followup:** Proof irrelevance does not require evaluating the proofs and comparing their outputs. The kernel treats any two proofs of the same \`Prop\` as definitionally equal.

### Incorrect answer B

> Both identify them because propositions-as-types means every inhabited type has exactly one value.

**Followup:** Propositions-as-types says that a term can serve as evidence. It does not make every inhabited type a singleton. Ordinary data types can have many distinguishable values.

## Question 2: existence versus computation

**Question:** In Lean, you prove that a natural number satisfying some property exists, using classical reasoning. Why might that still fail to give you an executable function that returns such a number?

### Correct answer

The proof establishes existence but may supply no computational method for selecting a witness. Using classical choice to define the selected number can require \`noncomputable\`.

**Followup:** Correct. The proof remains a checked term; the missing part is an executable witness-selection method.

### Amber’s answer

> proofs in classical reasoning don't necessarily produce proof objects, they might have noncomputable.

**Followup:** Almost. Classical proofs still produce proof terms that Lean checks. What may be absent is a computational method for finding the witness.

### Incorrect answer A

> Lean knows how to calculate the number, but classical proofs are too slow to run.

**Followup:** This is not a speed distinction. Classical choice itself supplies no executable search procedure, even one that would take a very long time.

### Incorrect answer B

> Proof irrelevance means Lean forgot which number the proof found.

**Followup:** Proof irrelevance concerns proofs, not equality of numbers. An existence proof in \`Prop\` is not generally eliminable into computational data; moreover, a classical proof may never supply an executable witness-finding method in the first place.

## Question 3: tactics and trust

**Question:** A Lean tactic solves a theorem. What does it produce, and what checks that the result is valid?

### Correct answer

It produces a proof term, and Lean’s kernel type checker checks it against the theorem’s type.

**Followup:** Correct. For ordinary proof-producing tactics, the tactic’s success report is not the justification; the checked term is.

### Amber’s answer

> a proof term, and the type checker

**Followup:** Correct—specifically, Lean’s kernel type checker.

### Incorrect answer A

> It returns true, and Lean trusts the tactic because it’s part of the standard library.

**Followup:** A Boolean success flag is not a proof. The tactic must supply a term that the kernel accepts as having the theorem’s type.

### Incorrect answer B

> It produces a convincing derivation, and another tactic reviews it.

**Followup:** Tactics can assist one another, but the final check is type checking a proof term in the kernel, not a second heuristic review.

## Question 4: extracting a witness

**Question:** In Agda, you represent “there exists a natural number satisfying P” as a pair containing \`n : ℕ\` and evidence of \`P n\`. You construct this pair without postulates. What can you obtain from this pair that a Lean classical existence proof alone needn’t provide?

### Correct answer

You can project out the actual witness \`n\`; for a closed, total computational construction, you can evaluate it to a natural number.

**Followup:** Correct. The pair carries the witness as data. Lean can also use computational dependent pairs or subtypes; this capability is not exclusive to Agda.

### Amber’s answer

> you get the actual number n

**Followup:** Exactly. You can project out the witness, rather than having only an existence claim.

### Incorrect answer A

> You can get the proof, but the number is only a type annotation and gets erased.

**Followup:** In this representation, the number is the first data component of the pair. It is available by projection; it is not merely an annotation.

### Incorrect answer B

> You get the smallest number satisfying P.

**Followup:** You get whichever witness the construction supplies. Minimality requires an additional property and evidence for it.

## Question 5: revisiting noncomputability

**Question:** If a Lean definition is marked \`noncomputable\`, does that mean its supporting proof is missing or unchecked? What does it actually mean?

### Correct answer

No. Lean still checks the definition and any proof terms. The marker permits a definition whose computational dependencies lack executable implementations, such as classical choice. It does not prove that the same function could never have an algorithm.

**Followup:** Correct. Separate logical checking, executability of this definition, and whether some other algorithm could compute the same result.

### Amber’s answer

> no the proof could still be good. it means there might not be a program to extract to compute the values because the program would hit noncomputable.

**Followup:** Correct in substance. More precisely, this is not a runtime failure that the program eventually hits: Lean does not obtain executable code for the definition through those noncomputable dependencies.

### Incorrect answer A

> It’s like an unsafe block: Lean skips checking it and takes my word for it.

**Followup:** \`noncomputable\` does not disable logical checking. It concerns generating executable code, not accepting unchecked proof claims.

### Incorrect answer B

> It means Lean has proved that no algorithm can compute this function.

**Followup:** No. This particular definition may depend on classical choice even when a different, constructive definition computes the same function. An impossibility result requires its own proof.

## Question 6: proofs-as-programs

**Question:** Someone says, “Lean uses tactics, Agda uses programs, so only Agda follows proofs-as-programs.” What’s wrong with that claim?

### Correct answer

Lean tactics construct typed proof terms. Both languages represent proofs as terms of types; their common authoring workflows differ. This does not guarantee executable witness extraction from every proof.

**Followup:** Correct. Distinguish how a proof is written from what the resulting proof is.

### Amber’s answer

> lean can extract programs from the proof term constructed from tactics

**Followup:** You identified the crucial connection: tactics construct proof terms. But executable extraction is not guaranteed. Lean erases \`Prop\` proofs during compilation, and classical choice need not compute. The shared principle is that proofs are typed terms.

### Incorrect answer A

> The claim is right: tactics are a separate proof language outside the type system.

**Followup:** Tactic syntax is a way to construct terms inside the type-theoretic foundation. The generated proof still has to type-check.

### Incorrect answer B

> The claim is wrong because every Lean proof compiles into a function that returns the thing proved to exist.

**Followup:** That goes too far. A checked existence proof in \`Prop\` does not generally provide an executable witness-returning function, especially when classical choice is involved.

## Question 7: representing certified data

**Question:** In Lean, how would you represent “a natural number together with evidence that it satisfies P” so you can compute with the number? Describe the structure and which universe it belongs in.

### Correct answer

Use a subtype \`{ n : Nat // P n }\` in \`Type\`. An inhabitant contains a number \`n\` and evidence \`h : P n\`. A computable construction allows the number to be projected and computed with.

**Followup:** Correct. The evidence’s type depends on the particular number. Being in \`Type\` makes it a data representation; the construction must also be computable.

### Amber’s answer

> something like a tuple with (Nat, Prop), which is in universe Type (i think)

**Followup:** Yes on \`Type\` and the pair idea. The second component must be a proof of \`P n\`, tied to the first component, rather than an arbitrary proposition. Lean’s subtype notation is \`{ n : Nat // P n }\`.

### Incorrect answer A

> Use \`∃ n : Nat, P n\`; then just read its first field.

**Followup:** Lean’s existential lives in \`Prop\` and cannot in general be projected into computational data like \`Nat\`. Use a subtype in \`Type\` when the witness needs to be available as data.

### Incorrect answer B

> Use \`Nat × Bool\`, with true meaning that P holds.

**Followup:** A Boolean field does not establish a relationship between the number and P. You could attach \`true\` to an invalid number. You need evidence whose type specifically asserts \`P n\`.

## Question 8: propositions versus evidence

**Question:** Why would an ordinary pair \`Nat × Prop\` fail to express that guarantee?

### Correct answer

It contains a number and an arbitrary proposition, not evidence that \`P n\` holds. It also does not require the proposition to be tied to the chosen number.

**Followup:** Correct. You need both the dependency on \`n\` and an inhabitant of the resulting proposition.

### Amber’s answer

> oh right, i see. if the second term is just Prop, it would be any proposition. not specifically a proof of P n

**Followup:** Exactly. \`P n : Prop\` is a proposition, while \`h : P n\` is evidence of it. The second component needs the latter.

### Incorrect answer A

> It does express it, because every value of type Prop is a true proposition.

**Followup:** \`False\` is also a value of type \`Prop\`. Being a proposition does not make it true; an inhabitant of that proposition would constitute evidence.

### Incorrect answer B

> The problem is just that the tuple fields aren’t named. A record with fields called number and proof would fix it.

**Followup:** Field names do not establish the guarantee. The proof field must have type \`P number\`, not merely \`Prop\`.

## Question 9: final synthesis

**Question:** Give one foundational difference and one typical workflow difference between Lean and Agda.

### Correct answer

Lean’s \`Prop\` has definitional proof irrelevance, whereas ordinary Agda types in \`Set\` do not automatically identify their inhabitants. Lean commonly uses tactics; Agda commonly uses pattern matching and typed holes. Both support direct proof terms and automation, and Agda also offers an optional proof-irrelevant \`Prop\` universe.

**Followup:** Correct. You have separated a rule of the type theory from a tendency in how people author proofs.

### Amber’s answer

> foundational difference: lean uses proof irrelevance, agda normally does not. typical workflow difference is lean uses tactics and agda uses programs (but both support both really).

**Followup:** Correct, with scope qualifications: Lean’s proof irrelevance applies to \`Prop\`, and Agda’s ordinary \`Set\` lacks that automatic rule. “Both support both” captures the overlap, though their automation tooling differs substantially.

### Incorrect answer A

> Lean is classical and Agda is constructive, so Lean can prove things but can’t really be used as a programming language.

**Followup:** Both support constructive reasoning and programming. Lean makes classical reasoning readily available, and Agda can postulate classical principles. The effect on computation depends on the definitions and assumptions used.

### Incorrect answer B

> Lean has dependent types, while Agda just uses very advanced generics. Lean writes proofs and Agda writes tests.

**Followup:** Both have dependent types and both can express machine-checked proofs. An Agda proof is not merely a test on selected inputs; a term of a universally quantified type establishes the corresponding general claim.
